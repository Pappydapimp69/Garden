name: Build Artifact

on:
  push:
    branches: [main, "claude/new-session-drRJy"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Read version
        id: version
        run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> $GITHUB_OUTPUT
      - name: Install dependencies
        run: npm install
      - name: Build artifact
        run: node build.mjs --artifact
      - name: Create versioned copy
        run: cp dist/garden-artifact.html dist/garden-artifact-v${{ steps.version.outputs.version }}.html
      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "Garden Journal v${{ steps.version.outputs.version }}"
          prerelease: true
          files: |
            dist/garden-artifact.html
            dist/garden-artifact-v${{ steps.version.outputs.version }}.html
